<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Theater Navigator</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>Movie Theater Navigator</h1>
  </header>
  <main>
    <section id="date-selector">
      <button id="prev-date" aria-label="Previous date">&#8592;</button>
      <span id="current-date">Today</span>
      <button id="next-date" aria-label="Next date">&#8594;</button>
    </section>
    <section id="filter-settings">
      <input type="text" id="filter-input" placeholder="Filter movies...">
      <button id="settings-btn" aria-label="Settings">&#9881;</button>
    </section>
    <section id="settings-panel" class="hidden">
      <h2>Table Columns</h2>
      <div id="column-toggles"></div>
    </section>
    <section id="movies-table-section">
      <table id="movies-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/filters.js"></script>
  <script src="assets/js/storage.js"></script>
</body>
</html>
